# Storefront (React build) for jamshan.com — replaces Vercel.
# Install:  sudo cp deploy/nginx/jamshan-frontend.conf /etc/nginx/sites-available/jamshan-frontend
#           sudo ln -s /etc/nginx/sites-available/jamshan-frontend /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d jamshan.com -d www.jamshan.com -d api.jamshan.com   (HTTPS, see DEPLOYMENT.md)
# Canonical host is www.jamshan.com (matches robots.txt / FRONTEND_URL). Change both if you prefer the bare domain.

# Social-media crawlers (WhatsApp, Facebook, ...) do not run JavaScript. For product links they get a small
# HTML page with the product photo/name/price from Django instead of the empty React shell.
map $http_user_agent $jh_share_bot {
    default 0;
    ~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|telegrambot|slackbot|pinterest|discordbot|skypeuripreview) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name jamshan.com;
    return 301 https://www.jamshan.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.jamshan.com;

    root /var/www/jamshan-store/frontend/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Served by Django (same URLs Vercel used to rewrite) -------------------------------------------
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host api.jamshan.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /feeds/products.xml {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host api.jamshan.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Internal target for the social-crawler rewrite below.
    location ^~ /__share/ {
        internal;
        proxy_pass http://127.0.0.1:8004/share/product/;
        proxy_set_header Host api.jamshan.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Storefront --------------------------------------------------------------------------------------
    location ~ ^/product/(?<slug>[^/]+)/?$ {
        if ($jh_share_bot) {
            rewrite ^ /__share/$slug last;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Hashed build files — cache for a year.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anything with a file extension (favicon.png, robots.txt, ...) must exist, otherwise 404.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # React Router: every other URL is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
