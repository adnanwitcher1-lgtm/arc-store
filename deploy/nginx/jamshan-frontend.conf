# ONE domain for everything — jamshan.com:
#   https://www.jamshan.com/          storefront (React build)
#   https://www.jamshan.com/api/      Django REST API
#   https://www.jamshan.com/admin/    Django admin panel
# (No api.jamshan.com subdomain needed.)
#
# Install:  sudo cp deploy/nginx/jamshan-frontend.conf /etc/nginx/sites-available/jamshan
#           sudo ln -s /etc/nginx/sites-available/jamshan /etc/nginx/sites-enabled/jamshan
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d jamshan.com -d www.jamshan.com --redirect     (HTTPS, see DEPLOYMENT.md)
# Canonical host is www.jamshan.com (matches robots.txt / FRONTEND_URL). Gunicorn listens on 127.0.0.1:8004.

# Social-media crawlers (WhatsApp, Facebook, ...) do not run JavaScript. For product links they get a small
# HTML page with the product photo/name/price from Django instead of the empty React shell.
map $http_user_agent $jh_share_bot {
    default 0;
    ~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|telegrambot|slackbot|pinterest|discordbot|skypeuripreview) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name jamshan.com;
    return 301 https://www.jamshan.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.jamshan.com;

    root /var/www/jamshan-store/frontend/dist;
    index index.html;

    client_max_body_size 20m;   # product image uploads in /admin/

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Django (Gunicorn on 127.0.0.1:8004) -------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # CSS/JS of the admin panel and the browsable API (collected by `manage.py collectstatic`)
    location ^~ /static/ {
        alias /var/www/jamshan-store/backend/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /feeds/products.xml {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Internal target for the social-crawler rewrite below.
    location ^~ /__share/ {
        internal;
        proxy_pass http://127.0.0.1:8004/share/product/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Storefront --------------------------------------------------------------------------------------
    location ~ ^/product/(?<slug>[^/]+)/?$ {
        if ($jh_share_bot) {
            rewrite ^ /__share/$slug last;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Hashed build files — cache for a year.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anything with a file extension (favicon.png, robots.txt, ...) must exist, otherwise 404.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # React Router: every other URL is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
