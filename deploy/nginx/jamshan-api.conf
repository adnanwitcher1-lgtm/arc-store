# REFERENCE ONLY — the api.jamshan.com block already exists on your server (port 80 -> Gunicorn 8004).
# Compare it with this file; only copy it if you are setting the server up from scratch.
# After `certbot --nginx -d api.jamshan.com ...` Certbot adds the HTTPS part automatically.
server {
    listen 80;
    listen [::]:80;
    server_name api.jamshan.com;

    client_max_body_size 10m;   # product image uploads in /admin/

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
